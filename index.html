<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gestione Anagrafica, Gruppi & Eventi</title>
  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="data:application/json,{
    \"name\": \"Anagrafica Eventi\",
    \"short_name\": \"EventiDB\",
    \"start_url\": \".\",
    \"display\": \"standalone\",
    \"background_color\": \"#f8fafc\",
    \"theme_color\": \"#2563eb\"
  }">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Dexie.js per IndexedDB -->
  <script src="https://cdn.jsdelivr.net/npm/dexie@3.2.4/dist/dexie.min.js"></script>
  <!-- jsPDF & AutoTable -->
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.5.28/dist/jspdf.plugin.autotable.min.js"></script>
  <!-- SheetJS per Import/Export Excel Nativo (.xlsx, .xls, .csv) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js"></script>

  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .pb-safe { padding-bottom: calc(4.5rem + env(safe-area-inset-bottom)); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen pb-safe">

  <!-- APP CONTAINER -->
  <div id="app" class="max-w-md mx-auto min-h-screen flex flex-col bg-white shadow-md relative">
    
    <!-- HEADER -->
    <header class="bg-blue-600 text-white p-4 sticky top-0 z-20 flex justify-between items-center shadow">
      <h1 id="header-title" class="font-bold text-lg tracking-wide flex items-center gap-2">
        <i data-lucide="users"></i> Anagrafica & Gruppi
      </h1>
      <button onclick="navigate('impostazioni')" class="text-blue-100 hover:text-white">
        <i data-lucide="settings" class="w-5 h-5"></i>
      </button>
    </header>

    <!-- CONTENT AREA -->
    <main class="flex-1 p-4 overflow-y-auto" id="main-content"></main>

    <!-- BOTTOM NAVBAR -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-slate-200 flex justify-around items-center h-16 z-30 px-1">
      <button onclick="navigate('home')" class="nav-btn flex flex-col items-center text-slate-500 hover:text-blue-600" id="nav-home">
        <i data-lucide="home" class="w-5 h-5"></i>
        <span class="text-[10px] mt-1 font-medium">Home</span>
      </button>
      <button onclick="navigate('persone')" class="nav-btn flex flex-col items-center text-slate-500 hover:text-blue-600" id="nav-persone">
        <i data-lucide="users" class="w-5 h-5"></i>
        <span class="text-[10px] mt-1 font-medium">Persone</span>
      </button>
      <button onclick="navigate('gruppi')" class="nav-btn flex flex-col items-center text-slate-500 hover:text-blue-600" id="nav-gruppi">
        <i data-lucide="folder-users" class="w-5 h-5"></i>
        <span class="text-[10px] mt-1 font-medium">Gruppi</span>
      </button>
      <button onclick="navigate('liste')" class="nav-btn flex flex-col items-center text-slate-500 hover:text-blue-600" id="nav-liste">
        <i data-lucide="calendar" class="w-5 h-5"></i>
        <span class="text-[10px] mt-1 font-medium">Eventi</span>
      </button>
      <button onclick="navigate('nuova-persona')" class="bg-blue-600 text-white rounded-full p-2.5 shadow-lg hover:bg-blue-700 active:scale-95 transition">
        <i data-lucide="user-plus" class="w-5 h-5"></i>
      </button>
    </nav>

  </div>

  <div id="modal-container"></div>

  <script>
    // --- DB SCHEMA ---
    const db = new Dexie('AnagraficaEventiDB');
    db.version(2).stores({
      persone: '++id, nome, cognome, data_nascita, luogo_nascita, data_inserimento',
      gruppi: '++id, nome, descrizione, colore',
      persone_gruppi: '++id, persona_id, gruppo_id, [gruppo_id+persona_id]',
      liste: '++id, nome, data_evento, data_creazione',
      persone_liste: '++id, persona_id, lista_id, presente, [lista_id+persona_id]'
    });

    let currentView = 'home';
    let currentParam = null;

    window.addEventListener('DOMContentLoaded', async () => {
      lucide.createIcons();
      await seedDemoData();
      navigate('home');
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
    });

    function navigate(view, param = null) {
      currentView = view;
      currentParam = param;
      const main = document.getElementById('main-content');
      
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('text-blue-600'));
      const activeNav = document.getElementById(`nav-${view}`);
      if(activeNav) activeNav.classList.add('text-blue-600');

      switch(view) {
        case 'home': renderHome(main); break;
        case 'persone': renderPersone(main); break;
        case 'scheda-persona': renderSchedaPersona(main, param); break;
        case 'nuova-persona': renderFormPersona(main, param); break;
        case 'gruppi': renderGruppi(main); break;
        case 'dettaglio-gruppo': renderDettaglioGruppo(main, param); break;
        case 'liste': renderListe(main); break;
        case 'dettaglio-lista': renderDettaglioLista(main, param); break;
        case 'nuova-lista': renderFormLista(main); break;
        case 'impostazioni': renderImpostazioni(main); break;
        default: renderHome(main);
      }
      lucide.createIcons();
    }

    // --- HOME VIEW ---
    async function renderHome(container) {
      const totalPersone = await db.persone.count();
      const totalGruppi = await db.gruppi.count();
      const totalListe = await db.liste.count();
      const ultimePersone = await db.persone.orderBy('data_inserimento').reverse().limit(3).toArray();

      container.innerHTML = `
        <div class="space-y-4">
          <div class="grid grid-cols-3 gap-2">
            <div class="bg-blue-50 border border-blue-100 p-3 rounded-xl shadow-sm text-center">
              <span class="text-[10px] font-bold text-blue-600 uppercase">Persone</span>
              <p class="text-xl font-bold text-slate-800 mt-0.5">${totalPersone}</p>
            </div>
            <div class="bg-purple-50 border border-purple-100 p-3 rounded-xl shadow-sm text-center">
              <span class="text-[10px] font-bold text-purple-600 uppercase">Gruppi</span>
              <p class="text-xl font-bold text-slate-800 mt-0.5">${totalGruppi}</p>
            </div>
            <div class="bg-emerald-50 border border-emerald-100 p-3 rounded-xl shadow-sm text-center">
              <span class="text-[10px] font-bold text-emerald-600 uppercase">Eventi</span>
              <p class="text-xl font-bold text-slate-800 mt-0.5">${totalListe}</p>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <button onclick="navigate('nuova-persona')" class="p-3 bg-slate-800 text-white rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 active:bg-slate-900">
              <i data-lucide="user-plus" class="w-4 h-4"></i> + Persona
            </button>
            <button onclick="openModalNuovoGruppo()" class="p-3 bg-purple-600 text-white rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 active:bg-purple-700">
              <i data-lucide="folder-plus" class="w-4 h-4"></i> + Gruppo
            </button>
          </div>

          <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
            <div class="flex justify-between items-center mb-3">
              <h3 class="text-xs font-bold text-slate-700 uppercase">Ultime persone inserite</h3>
              <button onclick="navigate('persone')" class="text-xs text-blue-600 font-semibold">Tutte</button>
            </div>
            <div class="divide-y divide-slate-100">
              ${ultimePersone.map(p => `
                <div onclick="navigate('scheda-persona', ${p.id})" class="py-2 flex items-center gap-3 cursor-pointer">
                  <img src="${p.foto || defaultAvatar()}" class="w-9 h-9 rounded-full object-cover border">
                  <div class="min-w-0 flex-1">
                    <p class="font-semibold text-xs text-slate-800 truncate">${escapeHtml(p.cognome)} ${escapeHtml(p.nome)}</p>
                    <p class="text-[10px] text-slate-400">${escapeHtml(p.luogo_nascita || 'N.D.')}</p>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // --- PERSONE VIEW ---
    async function renderPersone(container) {
      const gruppi = await db.gruppi.toArray();

      container.innerHTML = `
        <div class="space-y-3">
          <div class="sticky top-14 bg-slate-50 pt-1 pb-2 z-10 space-y-2">
            <div class="relative">
              <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
              <input type="text" id="search-persone" oninput="filterPersone()" placeholder="Cerca nome, cognome..." 
                class="w-full pl-9 pr-4 py-2 bg-white border border-slate-300 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">
            </div>
            <div class="flex gap-2">
              <select id="filter-gruppo-persone" onchange="filterPersone()" class="w-1/2 p-2 bg-white border border-slate-300 rounded-xl text-xs font-medium text-slate-700">
                <option value="">Tutti i Gruppi</option>
                ${gruppi.map(g => `<option value="${g.id}">${escapeHtml(g.nome)}</option>`).join('')}
              </select>
              <select id="sort-persone" onchange="filterPersone()" class="w-1/2 p-2 bg-white border border-slate-300 rounded-xl text-xs font-medium text-slate-700">
                <option value="alpha">A - Z (Cognome)</option>
                <option value="recent">Più recenti</option>
              </select>
            </div>
          </div>
          <div id="counter-persone" class="text-[11px] font-semibold text-slate-400 px-1"></div>
          <div id="persone-list" class="space-y-2"></div>
        </div>
      `;
      filterPersone();
    }

    async function filterPersone() {
      const query = document.getElementById('search-persone')?.value.toLowerCase().trim() || '';
      const gruppoId = document.getElementById('filter-gruppo-persone')?.value;
      const sort = document.getElementById('sort-persone')?.value || 'alpha';
      const listEl = document.getElementById('persone-list');
      const counterEl = document.getElementById('counter-persone');
      
      if (!listEl) return;

      let persone = await db.persone.toArray();

      if (gruppoId) {
        const assoc = await db.persone_gruppi.where('gruppo_id').equals(parseInt(gruppoId)).toArray();
        const validIds = new Set(assoc.map(a => a.persona_id));
        persone = persone.filter(p => validIds.has(p.id));
      }

      if (query) {
        persone = persone.filter(p => `${p.nome} ${p.cognome}`.toLowerCase().includes(query));
      }

      if (sort === 'alpha') {
        persone.sort((a, b) => a.cognome.localeCompare(b.cognome) || a.nome.localeCompare(b.nome));
      } else {
        persone.sort((a, b) => new Date(b.data_inserimento) - new Date(a.data_inserimento));
      }

      counterEl.innerText = `${persone.length} persone trovate`;

      if (persone.length === 0) {
        listEl.innerHTML = `<p class="text-center text-slate-400 text-xs py-8">Nessun nominativo trovato.</p>`;
        return;
      }

      listEl.innerHTML = persone.map(p => `
        <div onclick="navigate('scheda-persona', ${p.id})" class="bg-white p-3 rounded-xl border border-slate-200 flex items-center gap-3 shadow-sm active:bg-slate-50 transition cursor-pointer">
          <img src="${p.foto || defaultAvatar()}" loading="lazy" class="w-10 h-10 rounded-full object-cover border flex-shrink-0">
          <div class="flex-1 min-w-0">
            <h4 class="font-bold text-xs text-slate-800 truncate">${escapeHtml(p.cognome)} ${escapeHtml(p.nome)}</h4>
            <p class="text-[10px] text-slate-400">${formatDate(p.data_nascita)} ${p.luogo_nascita ? '• ' + escapeHtml(p.luogo_nascita) : ''}</p>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-slate-300"></i>
        </div>
      `).join('');
      lucide.createIcons();
    }

    // --- SCHEDA PERSONA ---
    async function renderSchedaPersona(container, id) {
      const persona = await db.persone.get(id);
      if (!persona) return navigate('persone');

      const assocG = await db.persone_gruppi.where('persona_id').equals(id).toArray();
      const gruppiIds = assocG.map(a => a.gruppo_id);
      const gruppi = await db.gruppi.where('id').anyOf(gruppiIds).toArray();

      const assocL = await db.persone_liste.where('persona_id').equals(id).toArray();
      const listeIds = assocL.map(a => a.lista_id);
      const liste = await db.liste.where('id').anyOf(listeIds).toArray();

      container.innerHTML = `
        <div class="space-y-4">
          <button onclick="navigate('persone')" class="text-xs font-semibold text-blue-600 flex items-center gap-1">
            <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Elenco persone
          </button>

          <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm text-center">
            <img src="${persona.foto || defaultAvatar()}" class="w-28 h-28 rounded-full object-cover border-2 border-blue-500 mx-auto shadow">
            <h2 class="text-lg font-bold text-slate-800 mt-2">${escapeHtml(persona.nome)} ${escapeHtml(persona.cognome)}</h2>
            
            <div class="mt-2 text-xs text-slate-600 space-y-0.5 bg-slate-50 p-2.5 rounded-lg border border-slate-100">
              <p><strong>Nato il:</strong> ${formatDate(persona.data_nascita)}</p>
              <p><strong>Luogo:</strong> ${escapeHtml(persona.luogo_nascita || 'N.D.')}</p>
            </div>

            <div class="grid grid-cols-2 gap-2 mt-3">
              <button onclick="navigate('nuova-persona', ${persona.id})" class="p-2 bg-slate-100 text-slate-700 font-medium rounded-lg text-xs flex items-center justify-center gap-1">
                <i data-lucide="edit-2" class="w-3.5 h-3.5"></i> Modifica
              </button>
              <button onclick="deletePersona(${persona.id})" class="p-2 bg-rose-50 text-rose-600 font-medium rounded-lg text-xs flex items-center justify-center gap-1">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Elimina
              </button>
            </div>
          </div>

          <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm space-y-2">
            <div class="flex justify-between items-center">
              <h3 class="text-xs font-bold text-purple-700 uppercase">Gruppi d'appartenenza</h3>
              <button onclick="openAssociaGruppoModal(${persona.id})" class="text-xs text-purple-600 font-bold">+ Gestisci Gruppi</button>
            </div>

            <div class="flex flex-wrap gap-1.5 pt-1">
              ${gruppi.length === 0 ? `<p class="text-xs text-slate-400">Nessun gruppo associato.</p>` : 
                gruppi.map(g => `<span class="bg-purple-100 text-purple-800 text-[11px] font-semibold px-2.5 py-1 rounded-full">${escapeHtml(g.nome)}</span>`).join('')}
            </div>
          </div>

          <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm space-y-2">
            <h3 class="text-xs font-bold text-slate-700 uppercase">Eventi a cui partecipa</h3>
            ${liste.length === 0 ? `<p class="text-xs text-slate-400">Nessun evento associato.</p>` : `
              <div class="divide-y divide-slate-100">
                ${liste.map(l => `
                  <div class="py-1.5 flex justify-between items-center text-xs">
                    <div>
                      <p class="font-semibold text-slate-800">${escapeHtml(l.nome)}</p>
                      <p class="text-[10px] text-slate-400">${formatDate(l.data_evento)}</p>
                    </div>
                    <button onclick="navigate('dettaglio-lista', ${l.id})" class="text-blue-600 font-medium">Vedi</button>
                  </div>
                `).join('')}
              </div>
            `}
          </div>
        </div>
      `;
    }

    // --- FORM PERSONA ---
    async function renderFormPersona(container, id = null) {
      let persona = { nome: '', cognome: '', data_nascita: '', luogo_nascita: '', foto: '' };
      let selectedGruppi = new Set();

      if (id) {
        persona = await db.persone.get(id);
        const gAssoc = await db.persone_gruppi.where('persona_id').equals(id).toArray();
        selectedGruppi = new Set(gAssoc.map(a => a.gruppo_id));
      }

      const tuttiGruppi = await db.gruppi.toArray();

      container.innerHTML = `
        <div class="space-y-4">
          <h2 class="font-bold text-base text-slate-800">${id ? 'Modifica Persona' : 'Nuova Persona'}</h2>

          <form onsubmit="savePersona(event, ${id})" class="space-y-3">
            <div class="text-center">
              <img id="foto-preview" src="${persona.foto || defaultAvatar()}" class="w-20 h-20 rounded-full object-cover border mx-auto mb-2">
              <label class="cursor-pointer bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold px-3 py-1.5 rounded-lg border inline-flex items-center gap-1">
                <i data-lucide="camera" class="w-3.5 h-3.5"></i> Scatta / Carica Foto
                <input type="file" accept="image/*" onchange="handleImageUpload(event)" class="hidden">
              </label>
              <input type="hidden" id="foto-base64" value="${persona.foto || ''}">
            </div>

            <div>
              <label class="text-xs font-bold text-slate-600">Nome *</label>
              <input type="text" id="nome" required value="${escapeHtml(persona.nome)}" class="w-full p-2 bg-white border border-slate-300 rounded-xl text-xs">
            </div>

            <div>
              <label class="text-xs font-bold text-slate-600">Cognome *</label>
              <input type="text" id="cognome" required value="${escapeHtml(persona.cognome)}" class="w-full p-2 bg-white border border-slate-300 rounded-xl text-xs">
            </div>

            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="text-xs font-bold text-slate-600">Data Nascita</label>
                <input type="date" id="data_nascita" value="${persona.data_nascita || ''}" class="w-full p-2 bg-white border border-slate-300 rounded-xl text-xs">
              </div>
              <div>
                <label class="text-xs font-bold text-slate-600">Luogo Nascita</label>
                <input type="text" id="luogo_nascita" value="${escapeHtml(persona.luogo_nascita || '')}" class="w-full p-2 bg-white border border-slate-300 rounded-xl text-xs">
              </div>
            </div>

            <div>
              <label class="text-xs font-bold text-slate-600">Associa ai Gruppi</label>
              <div class="mt-1 space-y-1 max-h-32 overflow-y-auto border border-slate-200 p-2 rounded-xl bg-slate-50">
                ${tuttiGruppi.length === 0 ? `<p class="text-[11px] text-slate-400">Nessun gruppo creato.</p>` : 
                  tuttiGruppi.map(g => `
                    <label class="flex items-center gap-2 text-xs font-medium text-slate-700 cursor-pointer">
                      <input type="checkbox" name="gruppi-select" value="${g.id}" ${selectedGruppi.has(g.id) ? 'checked' : ''} class="rounded text-purple-600">
                      <span>${escapeHtml(g.nome)}</span>
                    </label>
                  `).join('')}
              </div>
            </div>

            <button type="submit" class="w-full p-3 bg-blue-600 text-white font-bold rounded-xl text-xs shadow active:bg-blue-700">
              Salva Scheda
            </button>
          </form>
        </div>
      `;
    }

    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const MAX = 600;
          let w = img.width, h = img.height;
          if (w > MAX) { h *= MAX / w; w = MAX; }
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          const compressed = canvas.toDataURL('image/jpeg', 0.75);
          document.getElementById('foto-preview').src = compressed;
          document.getElementById('foto-base64').value = compressed;
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function savePersona(e, id) {
      e.preventDefault();
      const nome = document.getElementById('nome').value.trim();
      const cognome = document.getElementById('cognome').value.trim();
      const data_nascita = document.getElementById('data_nascita').value;
      const luogo_nascita = document.getElementById('luogo_nascita').value.trim();
      const foto = document.getElementById('foto-base64').value;

      const selectedGruppiIds = Array.from(document.querySelectorAll('input[name="gruppi-select"]:checked')).map(cb => parseInt(cb.value));

      if (!id) {
        const duplicati = await db.persone.where({ nome, cognome }).toArray();
        if (duplicati.length > 0 && !confirm(`Persona nominata ${nome} ${cognome} già esistente. Salvare comunque?`)) return;
      }

      const data = { nome, cognome, data_nascita, luogo_nascita, foto, data_inserimento: id ? (await db.persone.get(id)).data_inserimento : new Date().toISOString() };
      
      let personaId = id;
      if (id) {
        await db.persone.update(id, data);
        await db.persone_gruppi.where('persona_id').equals(id).delete();
      } else {
        personaId = await db.persone.add(data);
      }

      const gAssoc = selectedGruppiIds.map(gruppo_id => ({ persona_id: personaId, gruppo_id }));
      await db.persone_gruppi.bulkAdd(gAssoc);

      navigate('scheda-persona', personaId);
    }

    async function deletePersona(id) {
      if (confirm('Eliminare definitivamente questa persona?')) {
        await db.persone.delete(id);
        await db.persone_gruppi.where('persona_id').equals(id).delete();
        await db.persone_liste.where('persona_id').equals(id).delete();
        navigate('persone');
      }
    }

    // --- SEZIONE GRUPPI ---
    async function renderGruppi(container) {
      const gruppi = await db.gruppi.toArray();

      container.innerHTML = `
        <div class="space-y-4">
          <div class="flex justify-between items-center">
            <h2 class="font-bold text-base text-slate-800">Gestione Gruppi</h2>
            <button onclick="openModalNuovoGruppo()" class="p-2 bg-purple-600 text-white rounded-xl text-xs font-bold flex items-center gap-1">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i> Nuovo Gruppo
            </button>
          </div>

          <div class="space-y-2">

        b.classList.add('bg-slate-200', 'text-slate-700');

    async function filterPresenze(listaId) {
      const query = document.getElementById('search-presenze')?.value.toLowerCase().trim() || '';
      const container = document.getElementById('lista-presenze-container');
      const statsBadge = document.getElementById('stats-badge');
      if (!container) return;

      const assoc = await db.persone_liste.where('lista_id').equals(listaId).toArray();
      const personeIds = assoc.map(a => a.persona_id);
      const persone = await db.persone.where('id').anyOf(personeIds).toArray();

      const mapAssoc = {};
      assoc.forEach(a => mapAssoc[a.persona_id] = a);

      let totali = persone.length;
      let presentiCount = assoc.filter(a => a.presente === 1).length;
      let assentiCount = totali - presentiCount;

      statsBadge.innerHTML = `
        <div class="bg-slate-50 p-1 rounded-lg border">Tot: ${totali}</div>
        <div class="bg-emerald-50 text-emerald-700 p-1 rounded-lg border border-emerald-100">Pres: ${presentiCount}</div>
        <div class="bg-rose-50 text-rose-700 p-1 rounded-lg border border-rose-100">Ass: ${assentiCount}</div>
      `;

      let filtered = persone.filter(p => {
        const a = mapAssoc[p.id];
        const match = `${p.nome} ${p.cognome}`.toLowerCase().includes(query);
        if (!match) return false;
        if (window.currentPresenceFilter === 'presenti') return a.presente === 1;
        if (window.currentPresenceFilter === 'assenti') return a.presente !== 1;
        return true;
      });

      filtered.sort((a, b) => a.cognome.localeCompare(b.cognome));

      container.innerHTML = filtered.map(p => {
        const a = mapAssoc[p.id];
        const isPres = a.presente === 1;
        return `
          <div class="bg-white p-2.5 rounded-xl border border-slate-200 flex items-center justify-between gap-2 shadow-sm">
            <div class="flex items-center gap-2 min-w-0" onclick="navigate('scheda-persona', ${p.id})">
              <img src="${p.foto || defaultAvatar()}" class="w-8 h-8 rounded-full object-cover border">
              <p class="font-bold text-xs text-slate-800 truncate">${escapeHtml(p.cognome)} ${escapeHtml(p.nome)}</p>
            </div>

            <button onclick="togglePresenza(${a.id}, ${isPres ? 0 : 1}, ${listaId})" 
              class="px-2.5 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1 ${
                isPres ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-500 border'
              }">
              <i data-lucide="${isPres ? 'check-circle' : 'circle'}" class="w-3.5 h-3.5"></i>
              ${isPres ? 'PRESENTE' : 'ASSENTE'}
            </button>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    async function exportData(listaId, format) {
      const lista = await db.liste.get(listaId);
      const filter = document.getElementById('export-filter').value;
      const assoc = await db.persone_liste.where('lista_id').equals(listaId).toArray();
      const personeIds = assoc.map(a => a.persona_id);
      const persone = await db.persone.where('id').anyOf(personeIds).toArray();
      const mapAssoc = {};
      assoc.forEach(a => mapAssoc[a.persona_id] = a);

      let data = persone.map(p => ({ ...p, presente: mapAssoc[p.id].presente === 1 }));
      if (filter === 'presenti') data = data.filter(d => d.presente);
      if (filter === 'assenti') data = data.filter(d => !d.presente);
      data.sort((a,b) => a.cognome.localeCompare(b.cognome));

      if (format === 'excel') {
        const rows = data.map((d, i) => ({
          'N.': i + 1,
          'Cognome': d.cognome,
          'Nome': d.nome,
          'Data di Nascita': formatDate(d.data_nascita),
          'Luogo di Nascita': d.luogo_nascita || '',
          'Stato Presenza': d.presente ? 'PRESENTE' : 'ASSENTE'
        }));

        const worksheet = XLSX.utils.json_to_sheet(rows);
        autoFitColumns(worksheet, rows);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Partecipanti");
        XLSX.writeFile(workbook, `${lista.nome}_esportazione.xlsx`);
      } else {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.setFontSize(14); doc.text(lista.nome, 14, 15);
        doc.setFontSize(10); doc.text(`Data Evento: ${formatDate(lista.data_evento)}`, 14, 22);
        doc.autoTable({
          head: [['N.', 'Cognome', 'Nome', 'Data Nascita', 'Stato']],
          body: data.map((d, i) => [i + 1, d.cognome, d.nome, formatDate(d.data_nascita), d.presente ? 'PRESENTE' : 'ASSENTE']),
          startY: 28, headStyles: { fillColor: [37, 99, 235] }
        });
        doc.save(`${lista.nome}_export.pdf`);
      }
      closeModal();
    }

          <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-3">
            <h3 class="text-xs font-bold text-slate-700 uppercase">Importa Persone da Excel / CSV</h3>

    // --- ESPORTAZIONE EXCEL CON COLONNE ADATTATE ---
    async function exportAllPeopleToExcel() {
      const persone = await db.persone.toArray();
      if (persone.length === 0) {
        alert('Nessuna persona presente nel database da esportare.');
        return;
      }

      persone.sort((a, b) => a.cognome.localeCompare(b.cognome));

      const allGruppi = await db.gruppi.toArray();
      const mapGruppi = {};
      allGruppi.forEach(g => mapGruppi[g.id] = g.nome);

      const allAssocG = await db.persone_gruppi.toArray();
      const mapPersonaGruppi = {};
      allAssocG.forEach(a => {
        if (!mapPersonaGruppi[a.persona_id]) mapPersonaGruppi[a.persona_id] = [];
        if (mapGruppi[a.gruppo_id]) mapPersonaGruppi[a.persona_id].push(mapGruppi[a.gruppo_id]);
      });

      const rows = persone.map((p, index) => ({
        'N.': index + 1,
        'Cognome': p.cognome,
        'Nome': p.nome,
        'Data di Nascita': formatDate(p.data_nascita),
        'Luogo di Nascita': p.luogo_nascita || '',
        'Gruppi': (mapPersonaGruppi[p.id] || []).join(', '),
        'Data Inserimento': formatDate(p.data_inserimento)
      }));

      const worksheet = XLSX.utils.json_to_sheet(rows);
      autoFitColumns(worksheet, rows);

      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Anagrafica Persone");

      const today = new Date().toISOString().split('T')[0];
      XLSX.writeFile(workbook, `Anagrafica_Persone_${today}.xlsx`);
    }

    function autoFitColumns(worksheet, jsonRows) {
      if (!jsonRows || jsonRows.length === 0) return;
      const colWidths = Object.keys(jsonRows[0]).map(key => ({
        wch: Math.max(key.length, ...jsonRows.map(r => String(r[key] || '').length)) + 3
      }));
      worksheet['!cols'] = colWidths;
    }

    // --- IMPORTAZIONE EXCEL/CSV CON RICONOSCIMENTO RIGOROSO COLONNE E GESTIONE GRUPPI ---
    async function importExcelPeople(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function(ev) {
        try {
          const data = new Uint8Array(ev.target.result);
          const workbook = XLSX.read(data, { type: 'array', cellDates: true });
          const firstSheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[firstSheetName];
          
          const rawRows = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

          if (rawRows.length === 0) {
            alert('Il file caricato sembra vuoto o non formattato correttamente.');
            return;
          }

          let imported = 0;
          let skipped = 0;

          // Mappa gruppi esistenti per nome miniuscolo -> id
          const existingGroups = await db.gruppi.toArray();
          const mapGroupsByName = {};
          existingGroups.forEach(g => mapGroupsByName[g.nome.toLowerCase().trim()] = g.id);

          for (const row of rawRows) {
            const keys = Object.keys(row);
            
            // RICONOSCIMENTO RIGOROSO DELLE COLONNE
            const cognomeKey = keys.find(k => /^cognome$/i.test(k.trim()) || /cognome/i.test(k.trim()));
            const nomeKey = keys.find(k => /^nome$/i.test(k.trim()) || (/nome/i.test(k.trim()) && !/cognome/i.test(k.trim())));
            const dataKey = keys.find(k => /data/i.test(k.trim()) || /nascita/i.test(k.trim()));
            const luogoKey = keys.find(k => /luogo/i.test(k.trim()) || /città/i.test(k.trim()) || /comune/i.test(k.trim()));
            const gruppiKey = keys.find(k => /grupp/i.test(k.trim()));

            const cognome = String(row[cognomeKey] || '').trim();
            const nome = String(row[nomeKey] || '').trim();
            let data_nascita = row[dataKey];
            const luogo_nascita = String(row[luogoKey] || '').trim();
            const gruppiStr = String(row[gruppiKey] || '').trim();

            if (!nome || !cognome) continue; // Salta righe non valide

            // Normalizza formato data
            if (data_nascita instanceof Date) {
              data_nascita = data_nascita.toISOString().split('T')[0];
            } else {
              data_nascita = parseItalianDate(String(data_nascita));
            }

            let personaId;
            const dup = await db.persone.where({ nome, cognome }).first();

            if (!dup) {
              personaId = await db.persone.add({
                nome,
                cognome,
                data_nascita,
                luogo_nascita,
                foto: '',
                data_inserimento: new Date().toISOString()
              });
              imported++;
            } else {
              personaId = dup.id;
              skipped++;
            }

            // GESTIONE E ASSOCIAZIONE GRUPPI DA EXCEL
            if (gruppiStr && personaId) {
              const namesList = gruppiStr.split(/[,;-]/).map(s => s.trim()).filter(s => s.length > 0);
              
              for (const gName of namesList) {
                const gLower = gName.toLowerCase();
                let gId = mapGroupsByName[gLower];

                // Se il gruppo non esiste nell'app, lo crea al volo
                if (!gId) {
                  gId = await db.gruppi.add({ nome: gName });
                  mapGroupsByName[gLower] = gId;
                }

                // Associa la persona al gruppo se non già associata
                const assocDup = await db.persone_gruppi.where({ persona_id: personaId, gruppo_id: gId }).first();
                if (!assocDup) {
                  await db.persone_gruppi.add({ persona_id: personaId, gruppo_id: gId });
                }
              }
            }
          }

          alert(`Importazione completata con successo!\n\n• Nuovi nominativi inseriti: ${imported}\n• Nominativi già esistenti (o aggiornati gruppi): ${skipped}`);
          navigate('persone');

        } catch (err) {
          console.error(err);
          alert('Errore nella lettura del file Excel/CSV. Assicurati che sia un file valido.');
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function parseItalianDate(dateStr) {
      if (!dateStr) return '';
      dateStr = dateStr.trim();
      if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return dateStr;
      const parts = dateStr.split(/[\/\.-]/);
      if (parts.length === 3) {
        const day = parts[0].padStart(2, '0');
        const month = parts[1].padStart(2, '0');
        const year = parts[2].length === 2 ? '19' + parts[2] : parts[2];
        if (year.length === 4) return `${year}-${month}-${day}`;
      }
      return dateStr;
    }

    async function exportBackup() {
      const data = {
        persone: await db.persone.toArray(),
        gruppi: await db.gruppi.toArray(),
        persone_gruppi: await db.persone_gruppi.toArray(),
        liste: await db.liste.toArray(),
        persone_liste: await db.persone_liste.toArray()
      };
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: "application/json" }));
      a.download = `backup_anagrafica_${new Date().toISOString().split('T')[0]}.json`;
      a.click();
    }

    async function importBackup(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async function(ev) {
        try {
          const data = JSON.parse(ev.target.result);
          if (data.persone && data.liste) {
            await db.persone.clear(); await db.gruppi.clear(); await db.persone_gruppi.clear();
            await db.liste.clear(); await db.persone_liste.clear();

            await db.persone.bulkAdd(data.persone);
            if (data.gruppi) await db.gruppi.bulkAdd(data.gruppi);
            if (data.persone_gruppi) await db.persone_gruppi.bulkAdd(data.persone_gruppi);
            await db.liste.bulkAdd(data.liste);
            await db.persone_liste.bulkAdd(data.persone_liste);

            alert('Backup ripristinato con successo!');
            navigate('home');
          }
        } catch(err) { alert('File di backup non valido.'); }
      };
      reader.readAsText(file);
    }

    // --- UTILITIES ---
    function closeModal() { document.getElementById('modal-container').innerHTML = ''; }
    function formatDate(d) { return d ? new Date(d).toLocaleDateString('it-IT') : 'N.D.'; }
    function escapeHtml(s) { return (s || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
    function defaultAvatar() { return 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 24 24" fill="%23cbd5e1"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>'; }

  </script>
